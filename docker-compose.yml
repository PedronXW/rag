name: einstein-test

services:
  postgres:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: einstein
      POSTGRES_PASSWORD: einstein
      POSTGRES_DB: einstein
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - infra-net

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - infra-net

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - infra-net

  langfuse:
    image: langfuse/langfuse:4
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://einstein:einstein@postgres:5432/langfuse
      DIRECT_URL: postgresql://einstein:einstein@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-local-secret}
      SALT: ${LANGFUSE_SALT:-local-salt}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      LANGFUSE_INIT_USER_EMAIL: admin@localhost
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_PASSWORD:-admin}
      LANGFUSE_INIT_PROJECT_NAME: einstein-test
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-local}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-local}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - infra-net

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - infra-net

  api:
    build: .
    command: ["sh", "-c", ".venv/bin/uvicorn einstein_test.main:create_app --host 0.0.0.0 --port 8000 --workers $${API_WORKERS:-1} --factory"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      API_WORKERS: ${API_WORKERS:-1}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-memory}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      DATABASE_URL: postgresql://einstein:einstein@postgres:5432/einstein
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET obrigatório no .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://spillway.ensinoeinstein.com/openai/v1}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      EMBEDDER: ${EMBEDDER:-openai}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      ALLOWED_MODELS: ${ALLOWED_MODELS:-azure/gpt-5-mini,azure/gpt-6-luna}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - infra-net

  worker:
    build: .
    command: [".venv/bin/celery", "-A", "einstein_test.tasks", "worker", "--loglevel=info"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      DATABASE_URL: postgresql://einstein:einstein@postgres:5432/einstein
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET obrigatório no .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://spillway.ensinoeinstein.com/openai/v1}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      EMBEDDER: ${EMBEDDER:-openai}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      ALLOWED_MODELS: ${ALLOWED_MODELS:-azure/gpt-5-mini,azure/gpt-6-luna}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - infra-net

volumes:
  pgdata:
  minio-data:
  ollama-data:

networks:
  infra-net:
    name: infra-net